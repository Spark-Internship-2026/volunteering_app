name: PR proof

# Fails until the PR description shows the change works (screenshot/recording preferred).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pr-proof.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

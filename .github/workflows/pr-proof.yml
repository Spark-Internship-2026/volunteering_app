name: PR proof

# Fails until the PR description shows the change works (screenshot/recording preferred).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Read the CURRENT description from the API (not the event payload) so re-runs
      # and back-to-back events (push + edit) always judge the latest text.
      - name: Fetch current PR description
        run: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/check-pr-proof.mjs
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md

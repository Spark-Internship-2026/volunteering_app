name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview build per PR; a new push cancels the old build.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork PRs don't get secrets, so only build previews for same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Previews build against the STAGING Firebase project and upload to the staging Worker.
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - name: Upload preview version
        run: >
          npx wrangler versions upload --env staging
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const lines = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").trim().split("\n");
            const upload = lines.map((l) => JSON.parse(l)).find((e) => e.type === "version-upload");
            const url = upload.preview_alias_url || upload.preview_url;
            const marker = "<!-- cloudflare-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${url}\n\nCommit \`${sha}\`. Uses the shared Firebase project (open rules, test data only). Staff logins: \`staff-auth@\`, \`staff-student@\`, \`staff-events@\`, \`staff-staff@example.com\`, password \`localdev123\`. Sign up normally for a student account.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
